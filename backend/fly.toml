app = "lanelines-api"
primary_region = "iad"

[build]

[deploy]
  release_command = "alembic upgrade head"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  # The matching engine's order books and the WebSocket connection manager
  # both live in a single process's memory (see app/core/deps.py) — this
  # must run as exactly one always-on machine. auto_stop_machines=false
  # keeps it from scaling to zero (which would wipe the order book);
  # min_machines_running=0 keeps `fly deploy` from provisioning a *second*
  # machine for zero-downtime HA (which would silently split the order
  # book across two independent in-memory processes instead) — this
  # already bit us once on the first deploy. The single machine's actual
  # count is pinned separately via `fly scale count 1`.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
